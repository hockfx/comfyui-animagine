name: Build and Push ComfyUI Animagine Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # permite correr manualmente desde GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # el build puede tardar ~60-90 min por la descarga del modelo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-animagine:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-animagine:${{ github.sha }}
          # Cache para acelerar rebuilds futuros
          cache-from: type=gha
          cache-to: type=gha,mode=max
